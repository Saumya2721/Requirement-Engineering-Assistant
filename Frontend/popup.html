<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="header">
    <h2>Requirement Assistant</h2>
    <span id="connection-badge" class="badge">Live Ready</span>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-clarify">Live Clarification</button>
    <button class="tab-btn" id="tab-results">Results & Comparison</button>
  </div>

  <!-- Tab 1: Live Feed & Clarifications -->
  <div id="view-clarify" class="tab-content active">
    <div class="section-title">Live Transcript & Detection</div>
    <div id="transcript-feed" class="scroll-box"></div>

    <div class="simulation-box">
      <textarea id="manual-turn-input" placeholder="Type or paste a speaker turn to test in real-time..."></textarea>
      <button id="send-turn-btn" class="btn-primary">Process Statement</button>
      <button id="load-sample-btn" class="btn-secondary">Load Sample Meeting</button>
    </div>

    <div class="section-title">Pending Clarification Questions</div>
    <div id="clarifications-container"></div>

    <button id="finalize-btn" class="btn-action">Finalize & Synthesize Requirements</button>
  </div>

  <!-- Tab 2: Results & Comparison -->
  <div id="view-results" class="tab-content">
    <div class="export-bar">
      <span>Export As:</span>
      <button class="export-btn" data-type="txt">TXT</button>
      <button class="export-btn" data-type="docx">DOCX</button>
      <button class="export-btn" data-type="pdf">PDF</button>
    </div>

    <div class="comparison-grid">
      <div class="score-card">
        <h4>Baseline (No Clarification)</h4>
        <div id="baseline-scores">Scores will appear here...</div>
      </div>
      <div class="score-card highlight">
        <h4>Refined (With Clarification)</h4>
        <div id="refined-scores">Scores will appear here...</div>
      </div>
    </div>

    <div class="section-title">Refined Requirements (FR & Categorized NFR)</div>
    <div id="requirements-display" class="scroll-box-large"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
